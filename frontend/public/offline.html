<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#244c43">
  <title>Offline - TeamSync</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/offline.css">
</head>
<body>
  <main>
    <img class="mark" src="/icons/icon-192.png" alt="" width="64" height="64">
    <h1>You are offline</h1>
    <p>TeamSync needs an internet connection to load projects, teams and messages. Reconnect and try again. Nothing you have already saved is lost.</p>
    <button id="retry" type="button">Try again</button>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script src="/offline.js"></script>
</body>
</html>
